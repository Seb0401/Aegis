name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Un push nuevo sobre la misma rama cancela la ejecución anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Los tests de integración crean su propia base de datos dentro de este
  # Postgres; esta URL es solo la conexión de administración.
  DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegis
  TEST_DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegis
  JWT_SECRET: secreto-de-ci-solo-para-compilar-y-pasar-los-tests-0000

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        # El job no arranca hasta que Postgres acepta conexiones: sin esto, los
        # tests fallarían de forma intermitente según lo que tarde el contenedor.
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los paquetes compilan antes que nada: el resto del monorepo consume sus
      # tipos desde `dist/`, así que sin esto el typecheck de la API no vale.
      - name: Compilar paquetes
        run: pnpm -r --filter "./packages/**" build

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # El OpenAPI publicado es el contrato del que FE genera su mock server.
      # Si alguien cambia una ruta y no lo regenera, aquí se ve.
      - name: El OpenAPI publicado está al día
        run: |
          pnpm --filter @aegis/api openapi
          git diff --exit-code docs/api/openapi.json \
            || (echo "::error::docs/api/openapi.json está desactualizado. Ejecuta 'pnpm --filter @aegis/api openapi' y súbelo." && exit 1)

  e2e:
    name: E2E del flujo de la demo
    runs-on: ubuntu-latest
    # Solo tiene sentido si lo demás compila: si el build falla, estos tests
    # fallarían por lo mismo y con mensajes peores.
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # La API no lee el `.env` por sí sola, así que aquí van una a una.
      # Ojo: NO se define NODE_ENV — `next build` hereda cualquier valor no
      # estándar y revienta prerenderizando `/_global-error`.
      DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegis
      JWT_SECRET: secreto-de-ci-solo-para-compilar-y-pasar-los-tests-0000
      ALLOW_DEV_LOGIN: 'true'
      USE_FAKE_STELLAR: 'true'
      NEXT_PUBLIC_ALLOW_DEV_LOGIN: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar paquetes
        run: pnpm -r --filter "./packages/**" build

      - name: Preparar la base de datos
        run: |
          pnpm db:migrate
          pnpm db:seed

      # `NODE_ENV=test` solo para la API, y solo aquí: es el interruptor que el
      # propio backend prevé para desactivar los límites de peticiones. Una
      # suite entera desde una sola IP pasa de 120 peticiones por minuto y se
      # bloquearía sola con 429. No se pone en el `env:` del job porque
      # `next dev` hereda cualquier NODE_ENV no estándar y se queja.
      - name: Levantar la API
        run: |
          NODE_ENV=test pnpm --filter @aegis/api dev &
          npx --yes wait-on http://localhost:3001/health --timeout 60000

      # Playwright usa el Chrome que ya trae el runner (`channel: 'chrome'`),
      # así que no hace falta descargar sus navegadores.
      - name: E2E
        run: pnpm --filter @aegis/web test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  secrets:
    name: Sin secretos en el diff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar claves secretas de Stellar
        run: |
          # Una clave secreta de Stellar es una cadena de 56 caracteres que
          # empieza por S. Nunca debe aparecer en el repositorio (§12).
          if git grep -nIE '\bS[A-Z2-7]{55}\b' -- ':!*.md' ':!pnpm-lock.yaml'; then
            echo "::error::Hay algo que parece una clave secreta de Stellar en el repositorio."
            exit 1
          fi
          echo "Sin claves secretas."

  docker:
    name: La imagen de la API se construye
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No se publica en ningún registro: solo se comprueba que la imagen
      # compila. Un Dockerfile que solo se prueba el día del despliegue es un
      # Dockerfile que falla el día del despliegue.
      - name: Construir
        run: docker build -f apps/api/Dockerfile -t aegis-api:ci .
